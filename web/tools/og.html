<svg width="0" height="0" style="position:absolute"><defs>
 <clipPath id="L"><polygon points="0,0 220,0 205,48 236,92 208,138 238,176 212,220 234,262 206,306 238,350 212,396 222,440 0,440"/></clipPath>
 <clipPath id="R"><polygon points="220,0 205,48 236,92 208,138 238,176 212,220 234,262 206,306 238,350 212,396 222,440 440,440 440,0"/></clipPath>
 <clipPath id="B"><path d="M220 18 C334 14 418 100 422 214 C426 332 336 426 220 422 C104 426 16 336 18 222 C14 106 104 22 220 18 Z"/></clipPath>

<div class="og">
 <div class="top"><span>Symbolon</span><b>NEAR testnet</b></div>
 <h1>Two halves must <em>fit</em> before an agent pays.</h1>

<script>
const PTS="220,0 205,48 236,92 208,138 238,176 212,220 234,262 206,306 238,350 212,396 222,440";
const BODY="M220 18 C334 14 418 100 422 214 C426 332 336 426 220 422 C104 426 16 336 18 222 C14 106 104 22 220 18 Z";
const half=(s,withText)=>`<g clip-path="url(#${s})"><path d="${BODY}" fill="url(#G)"/><path d="${BODY}" fill="#000" filter="url(#N)" opacity=".42" style="mix-blend-mode:multiply"/>`+
 ["M70 120 L370 120","M52 176 L388 176","M44 232 L396 232","M52 288 L388 288","M70 344 L370 344"].map(d=>`<path d="${d}" stroke="#0d0c0a" stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round"/>`).join("")+
 (withText?`<text x="220" y="246" text-anchor="middle" font-family="Instrument Serif" font-size="74" fill="#0d0c0a" fill-opacity=".86">Symbolon</text><text x="220" y="84" text-anchor="middle" font-family="Geist Mono" font-size="13" letter-spacing="5" fill="#0d0c0a" fill-opacity=".6">σύμβολον</text><text x="220" y="384" text-anchor="middle" font-family="Geist Mono" font-size="12" letter-spacing="2" fill="#0d0c0a" fill-opacity=".55">sha256 ≡ sha256</text>`:"")+
 `</g><g clip-path="url(#B)"><polyline points="${PTS}" fill="none" stroke="#7ad3b0" stroke-width="3" stroke-linejoin="round"/></g>`;
document.getElementById("tok").innerHTML=`<g>${half("L",true)}</g><g>${half("R",true)}</g>`;
