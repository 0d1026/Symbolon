[package]
name = "mock_usdc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sandbox and testnet stand-in for USDC: a NEP-141 token with 6 decimals"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
